<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="{% static 'css/profile_edit.css' %}">
</head>
<body>
    <header>
        {%include 'general/header.html' %}
    </header>
    <h1>Edit your profile</h1>
    <br>
    <form method="POST" action="{% url 'profile_edit' %}">
        {% csrf_token %}

        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="Enter username" name="username" value="{{ user.username }}" required><br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="abc@gmail.com" name="email" value="{{ user.email }}" required><br>

        <label for="password1">Password:</label>
        <input type="password" id="password1" placeholder="Enter password" name="password1" required><br>

        <label for="password2">Confirm Password:</label>
        <input type="password" id="password2" placeholder="Enter password again" name="password2" required><br>

        <p>Select your gender</p>
        <input type="radio" id="male" value="1" name="gender" required {% if info.gender == 1 %} checked {% endif %}>Male<br>
        <input type="radio" id="female" value="0" name="gender" required {% if info.gender == 0 %} checked {% endif %}>Female<br>

        <h2>About Yourself</h2>
        <label for="about">Write something about yourself:</label><br>
        <textarea id="about" name="about" rows="4" cols="50" placeholder="Tell us about yourself" required>{{user.about}}</textarea><br>

        <button type="submit">Save Changes</button>
    </form>
    <br>
    <a href="{% url 'profile' user.username %}">Back to Profile</a>

    <footer>
<!--        {% include 'general/footer.html' %}-->
    </footer>
</body>
</html>
