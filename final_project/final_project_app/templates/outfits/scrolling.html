<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover</title>
    <link rel="stylesheet" href="{% static 'css/scrolling.css' %}">
</head>
<body>
    {% include 'general/header.html' %}

    <div class="container">
        <h1>Discover Fashion</h1>
        <p>Swipe to choose your favorite looks!</p>

        <!-- Контейнер для карточек -->
        <div id="card-container"></div>
    </div>

    <footer>
        {% include 'general/footer.html' %}
    </footer>

    <!-- Include CSRF token -->
    <script src="{% static 'js/app.js' %}"></script>
    <script>
        // Ensure CSRF token is available for POST requests
        function getCSRFToken() {
            return "{{ csrf_token }}";
        }
    </script>
</body>
</html>
