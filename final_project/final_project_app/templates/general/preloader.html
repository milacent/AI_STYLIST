<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    window.addEventListener('load', () => {
    document.body.classList.add('loaded');
  });
</script>

<style>
    /* Прелоадер контейнер */
#preloader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #161616; /* тот же тёмный фон */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

/* Анимационный круг */
.loader {
    width: 60px;
    height: 60px;
    border: 6px solid #2c2c2c;
    border-top: 6px solid #4a90e2; /* голубой акцент */
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

/* Ключевые кадры */
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
body.loaded #preloader {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
}

</style>
<div id="preloader">
    <div class="loader"></div>
</div>
</body>
</html>
