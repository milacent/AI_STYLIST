<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Сообщения/ошибки -->
    {% if messages %}
    <div class="messages-container">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    <!-- Сообщения/ошибки -->

    <br>
<div class="wrapper">
    <div class="card">
        <div class="image-side">
            <img src="https://i.postimg.cc/J4rVgyh8/kurs-stilist-imidzhmejker-professionalnyj-kurs-ot-edited-free-carve-photos-6.png" alt="Login Illustration">
        </div>
        <div class="form-side">
            <h1>Welcome Back</h1>
            <p class="subtitle">Log in to continue your style journey</p>
            <form method="POST" action="{% url 'log_in' %}">
                {% csrf_token %}
                <div class="input-group">
                    <i class="fa fa-user icon"></i>
                    <input type="text" name="username" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <i class="fa fa-lock icon"></i>
                    <input type="password" name="password" placeholder="Password" required>
                </div>

                <button type="submit" class="submit-btn">Log In</button>
                <p class="login-link">Don't have an account? <a href="{% url 'sign_up' %}">Sign up here</a></p>
            </form>
        </div>
    </div>
</div>
</body>
</html>
