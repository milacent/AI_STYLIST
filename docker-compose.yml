version: '3'

services:
  web:
    build:
      context: .
    image: meow-web
    container_name: meow-django
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus
    container_name: meow-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana
    container_name: meow-grafana
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
